services:
  - type: web
    name: daily-hisab
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev && npm --prefix client install --include=dev && npm --prefix client run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_EMAIL
        value: admin@dailyhisab.com
      - key: ADMIN_PASSWORD
        sync: false
      # Neon (free, no expiry) — Render ড্যাশবোর্ডের Environment ট্যাবে ভ্যালু সেট করা আছে
      - key: DATABASE_URL
        sync: false